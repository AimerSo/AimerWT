name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.guard.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Guard (main only)
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          SHOULD="true"
          TAG="${{ github.event.release.tag_name }}"

          # 仅主仓库执行构建
          if [ "${{ github.repository }}" != "AimerSo/AimerWT" ]; then
            echo "Release workflow only runs in AimerSo/AimerWT (current: ${{ github.repository }})"
            SHOULD="false"
          fi

          if [[ ! "$TAG" == v* ]]; then
            echo "Release tag must start with v (current: $TAG)"
            SHOULD="false"
          fi

          if [ "$SHOULD" = "true" ]; then
            git fetch origin main:refs/remotes/origin/main --force
            COMMIT="$(git rev-list -n 1 "$TAG")"
            if git merge-base --is-ancestor "$COMMIT" "origin/main"; then
              echo "Tag commit is on main"
            else
              echo "Tag commit is NOT on main; skipping release"
              SHOULD="false"
            fi
          fi

          echo "should_release=$SHOULD" >> "$GITHUB_OUTPUT"

      - name: Determine Version
        id: version
        if: steps.guard.outputs.should_release == 'true'
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' && github.repository == 'AimerSo/AimerWT'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows amd64
          - os: windows-latest
            arch: amd64
            python-arch: x64
          # 暂不发布 Windows arm64：pythonnet/clr-loader 仅提供 x86/x64 NetFX 加载器
          # Linux amd64
          - os: ubuntu-latest
            arch: amd64
            python-arch: x64
          # Linux arm64
          - os: ubuntu-24.04-arm
            arch: arm64
            python-arch: arm64
          # macOS amd64 (Intel)
          - os: macos-15-intel
            arch: amd64
            python-arch: x64
          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            arch: arm64
            python-arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gtk+3 gobject-introspection pygobject3
          # 設置 PKG_CONFIG_PATH 以便找到 GTK 相關庫
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        env:
          PYTHONIOENCODING: utf-8
          REPORT_URL: ${{ secrets.REPORT_URL }}
          TELEMETRY_CLIENT_SECRET: ${{ secrets.TELEMETRY_CLIENT_SECRET }}
          TELEMETRY_SALT: ${{ secrets.TELEMETRY_SALT }}
        run: |
          python scripts/build.py

      - name: Prepare release assets
        run: >-
          python scripts/prepare_release_assets.py
          --platform "${{ runner.os }}"
          --arch "${{ matrix.arch }}"
          --output-dir release-assets

      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath release-assets -Filter '*.exe' -File)
          if ($executables.Count -ne 1) {
            throw "Expected exactly one Windows executable, found $($executables.Count)."
          }
          $stdoutPath = Join-Path $env:RUNNER_TEMP "aimerwt-self-test.stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "aimerwt-self-test.stderr.log"
          $process = Start-Process `
            -FilePath $executables[0].FullName `
            -ArgumentList @('--self-test') `
            -WindowStyle Hidden `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath
          $exitCode = $process.ExitCode
          $logPaths = @(
            $stdoutPath,
            $stderrPath,
            (Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Aimer_WT\logs\app.log'),
            (Join-Path $env:TEMP 'WT_Voice_Manager_logs\app.log')
          ) | Select-Object -Unique
          foreach ($logPath in $logPaths) {
            if (Test-Path -LiteralPath $logPath -PathType Leaf) {
              Write-Host "===== $logPath ====="
              Get-Content -LiteralPath $logPath
            }
          }
          if ($null -eq $exitCode) {
            throw "Windows executable self-test did not return an exit code."
          }
          if ($exitCode -ne 0) {
            throw "Windows executable self-test failed with exit code $exitCode."
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Attach Release Assets
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true' && github.repository == 'AimerSo/AimerWT' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: release-assets

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la release-assets/ || echo "No artifacts found"

      - name: Upload assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag_name }}"
          EXPECTED=(
            "AimerWT_V3.1_Beta_Windows_amd64.exe"
            "AimerWT_V3.1_Beta_Linux_amd64"
            "AimerWT_V3.1_Beta_Linux_arm64"
            "AimerWT_V3.1_Beta_macOS_amd64.zip"
            "AimerWT_V3.1_Beta_macOS_arm64.zip"
            "checksum_Windows_amd64.txt"
            "checksum_Linux_amd64.txt"
            "checksum_Linux_arm64.txt"
            "checksum_macOS_amd64.txt"
            "checksum_macOS_arm64.txt"
          )

          for asset in "${EXPECTED[@]}"; do
            if [ ! -s "release-assets/$asset" ]; then
              echo "Missing or empty release asset: $asset"
              exit 1
            fi
          done

          actual_count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [ "$actual_count" -ne "${#EXPECTED[@]}" ]; then
            echo "Expected ${#EXPECTED[@]} release files, found $actual_count"
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          for checksum_file in release-assets/checksum_*.txt; do
            asset_name="$(sed -n 's/^File: //p' "$checksum_file")"
            expected_hash="$(sed -n 's/^SHA256: //p' "$checksum_file")"
            actual_hash="$(sha256sum "release-assets/$asset_name" | awk '{print $1}')"
            if [ -z "$asset_name" ] || [ "$expected_hash" != "$actual_hash" ]; then
              echo "Checksum validation failed: $checksum_file"
              exit 1
            fi
          done

          gh release upload "$TAG" release-assets/* --repo "${{ github.repository }}" --clobber
