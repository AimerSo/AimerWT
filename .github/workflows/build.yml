name: Build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    if: github.repository == 'AimerSo/AimerWT'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows amd64
          - os: windows-latest
            arch: amd64
            python-arch: x64
          # Windows arm64
          - os: windows-11-arm
            arch: arm64
            python-arch: arm64
          # Linux amd64
          - os: ubuntu-latest
            arch: amd64
            python-arch: x64
          # Linux arm64
          - os: ubuntu-24.04-arm
            arch: arm64
            python-arch: arm64
          # macOS amd64 (Intel)
          - os: macos-15-intel
            arch: amd64
            python-arch: x64
          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            arch: arm64
            python-arch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: ${{ matrix.python-arch }}

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install gtk+3 gobject-introspection pygobject3
        # 設置 PKG_CONFIG_PATH 以便找到 GTK 相關庫
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build
      env:
        PYTHONIOENCODING: utf-8
        REPORT_URL: ${{ secrets.REPORT_URL }}
        TELEMETRY_CLIENT_SECRET: ${{ secrets.TELEMETRY_CLIENT_SECRET }}
        TELEMETRY_SALT: ${{ secrets.TELEMETRY_SALT }}
      run: |
        python scripts/build.py

    - name: Prepare release assets
      run: >-
        python scripts/prepare_release_assets.py
        --platform "${{ runner.os }}"
        --arch "${{ matrix.arch }}"
        --output-dir release-assets

    - name: Smoke test Windows executable
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $executables = @(Get-ChildItem -LiteralPath release-assets -Filter '*.exe' -File)
        if ($executables.Count -ne 1) {
          throw "Expected exactly one Windows executable, found $($executables.Count)."
        }
        $stdoutPath = Join-Path $env:RUNNER_TEMP "aimerwt-self-test.stdout.log"
        $stderrPath = Join-Path $env:RUNNER_TEMP "aimerwt-self-test.stderr.log"
        $process = Start-Process `
          -FilePath $executables[0].FullName `
          -ArgumentList @('--self-test') `
          -WindowStyle Hidden `
          -Wait `
          -PassThru `
          -RedirectStandardOutput $stdoutPath `
          -RedirectStandardError $stderrPath
        $exitCode = $process.ExitCode
        $logPaths = @(
          $stdoutPath,
          $stderrPath,
          (Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Aimer_WT\logs\app.log'),
          (Join-Path $env:TEMP 'WT_Voice_Manager_logs\app.log')
        ) | Select-Object -Unique
        foreach ($logPath in $logPaths) {
          if (Test-Path -LiteralPath $logPath -PathType Leaf) {
            Write-Host "===== $logPath ====="
            Get-Content -LiteralPath $logPath
          }
        }
        if ($null -eq $exitCode) {
          throw "Windows executable self-test did not return an exit code."
        }
        if ($exitCode -ne 0) {
          throw "Windows executable self-test failed with exit code $exitCode."
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.arch }}
        path: release-assets/*
        if-no-files-found: error
